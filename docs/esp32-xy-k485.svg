<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>Câblage ESP32-S3 et module XY-K485</title>
  <rect x="0" y="0" width="900" height="500" rx="14" fill="#ffffff"/>

  <text x="450" y="38" text-anchor="middle" font-size="22" font-weight="600" fill="#222">ESP32-S3 → module XY-K485</text>
  <text x="450" y="62" text-anchor="middle" font-size="14" fill="#666">4 fils, sans croisement : TX sur TXD, RX sur RXD</text>

  <!-- ESP32-S3 -->
  <rect x="60" y="100" width="230" height="300" rx="14" fill="#EEEDFE" stroke="#534AB7" stroke-width="2"/>
  <text x="175" y="132" text-anchor="middle" font-size="18" font-weight="600" fill="#3C3489">ESP32-S3</text>
  <text x="175" y="152" text-anchor="middle" font-size="12" fill="#534AB7">DevKit N16R8</text>
  <rect x="95" y="168" width="160" height="34" rx="4" fill="#ffffff" stroke="#AFA9EC"/>
  <text x="175" y="190" text-anchor="middle" font-size="12" fill="#7F77DD">module WROOM-1</text>
  <circle cx="290" cy="230" r="8" fill="#ffffff" stroke="#534AB7" stroke-width="2"/>
  <text x="272" y="235" text-anchor="end" font-size="16" font-weight="600" fill="#3C3489">3V3</text>
  <circle cx="290" cy="270" r="8" fill="#ffffff" stroke="#534AB7" stroke-width="2"/>
  <text x="272" y="275" text-anchor="end" font-size="16" font-weight="600" fill="#3C3489">GPIO17 (TX)</text>
  <circle cx="290" cy="310" r="8" fill="#ffffff" stroke="#534AB7" stroke-width="2"/>
  <text x="272" y="315" text-anchor="end" font-size="16" font-weight="600" fill="#3C3489">GPIO18 (RX)</text>
  <circle cx="290" cy="350" r="8" fill="#ffffff" stroke="#534AB7" stroke-width="2"/>
  <text x="272" y="355" text-anchor="end" font-size="16" font-weight="600" fill="#3C3489">GND</text>
  <!-- USB-C -->
  <rect x="140" y="384" width="70" height="26" rx="8" fill="#444441"/>
  <text x="175" y="402" text-anchor="middle" font-size="12" fill="#ffffff">USB-C</text>

  <!-- chargeur -->
  <rect x="100" y="440" width="150" height="40" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="1.5"/>
  <text x="175" y="465" text-anchor="middle" font-size="14" fill="#444441">Chargeur 5 V, 1 A</text>
  <path d="M 175 440 L 175 412" stroke="#444441" stroke-width="3" fill="none"/>

  <!-- XY-K485 -->
  <rect x="520" y="140" width="250" height="250" rx="14" fill="#E1F5EE" stroke="#0F6E56" stroke-width="2"/>
  <text x="645" y="172" text-anchor="middle" font-size="18" font-weight="600" fill="#085041">Module XY-K485</text>
  <text x="645" y="192" text-anchor="middle" font-size="12" fill="#0F6E56">côté TTL (connecteur blanc)</text>
  <circle cx="520" cy="230" r="8" fill="#ffffff" stroke="#0F6E56" stroke-width="2"/>
  <text x="538" y="235" font-size="16" font-weight="600" fill="#085041">VCC</text>
  <circle cx="520" cy="270" r="8" fill="#ffffff" stroke="#0F6E56" stroke-width="2"/>
  <text x="538" y="275" font-size="16" font-weight="600" fill="#085041">TXD</text>
  <circle cx="520" cy="310" r="8" fill="#ffffff" stroke="#0F6E56" stroke-width="2"/>
  <text x="538" y="315" font-size="16" font-weight="600" fill="#085041">RXD</text>
  <circle cx="520" cy="350" r="8" fill="#ffffff" stroke="#0F6E56" stroke-width="2"/>
  <text x="538" y="355" font-size="16" font-weight="600" fill="#085041">GND</text>
  <!-- cote RS485 -->
  <line x1="660" y1="215" x2="660" y2="370" stroke="#9FE1CB" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text x="715" y="230" text-anchor="middle" font-size="12" fill="#0F6E56">côté RS485</text>
  <text x="715" y="246" text-anchor="middle" font-size="12" fill="#0F6E56">(bornier bleu)</text>
  <text x="715" y="285" text-anchor="middle" font-size="15" font-weight="600" fill="#085041">A+</text>
  <text x="715" y="315" text-anchor="middle" font-size="15" font-weight="600" fill="#085041">B-</text>
  <text x="715" y="345" text-anchor="middle" font-size="15" font-weight="600" fill="#085041">Terre</text>
  <path d="M 770 315 L 815 315" stroke="#0F6E56" stroke-width="2" fill="none"/>
  <path d="M 815 315 L 807 309 M 815 315 L 807 321" stroke="#0F6E56" stroke-width="2" fill="none"/>
  <text x="822" y="310" font-size="12" fill="#0F6E56">jack de</text>
  <text x="822" y="326" font-size="12" fill="#0F6E56">la pompe</text>

  <!-- fils -->
  <path d="M 298 230 L 512 230" stroke="#E24B4A" stroke-width="4" fill="none"/>
  <path d="M 298 270 L 512 270" stroke="#EF9F27" stroke-width="4" fill="none"/>
  <path d="M 298 310 L 512 310" stroke="#7F77DD" stroke-width="4" fill="none"/>
  <path d="M 298 350 L 512 350" stroke="#2C2C2A" stroke-width="4" fill="none"/>

  <!-- libelles fils -->
  <rect x="345" y="217" width="120" height="24" rx="6" fill="#ffffff"/>
  <text x="405" y="234" text-anchor="middle" font-size="13" fill="#A32D2D">alimentation 3,3 V</text>
  <rect x="345" y="257" width="120" height="24" rx="6" fill="#ffffff"/>
  <text x="405" y="274" text-anchor="middle" font-size="13" fill="#854F0B">envoi (TX)</text>
  <rect x="345" y="297" width="120" height="24" rx="6" fill="#ffffff"/>
  <text x="405" y="314" text-anchor="middle" font-size="13" fill="#534AB7">réception (RX)</text>
  <rect x="345" y="337" width="120" height="24" rx="6" fill="#ffffff"/>
  <text x="405" y="354" text-anchor="middle" font-size="13" fill="#2C2C2A">masse</text>

  <text x="520" y="430" font-size="12" fill="#666">Si la pompe ne répond pas : inverser A+ et B-,</text>
  <text x="520" y="447" font-size="12" fill="#666">puis inverser les fils TXD et RXD.</text>
</svg>
